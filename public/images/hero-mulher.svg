  <path d="M288 342 Q320 368 352 342" stroke="#7A3A2A" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M296 346 Q320 360 344 346" fill="#FFFFFF"/>

  <!-- blazer gola / lapela -->
  <path d="M255 470 C270 500 290 515 320 518 C350 515 370 500 385 470 L392 520 C360 545 280 545 248 520 Z" fill="#16562D"/>

  <!-- celular na mão -->
  <g transform="translate(392 400) rotate(8)">
    <rect x="0" y="0" width="66" height="118" rx="14" fill="#0C2F1B"/>
    <rect x="6" y="10" width="54" height="98" rx="6" fill="url(#topGrad)"/>
    <rect x="18" y="30" width="30" height="8" rx="4" fill="#0C2F1B" opacity="0.55"/>
    <rect x="18" y="46" width="30" height="8" rx="4" fill="#0C2F1B" opacity="0.35"/>
    <circle cx="33" cy="78" r="12" fill="#0C2F1B" opacity="0.75"/>
    <path d="M27 78 l4 5 l9 -11" stroke="#EAFBEF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M370 470 C385 460 405 450 420 448 C430 447 440 452 440 462 C440 472 428 478 415 480 C400 483 385 480 372 490 Z" fill="url(#skinShade)"/>

  <!-- selo verificado flutuante -->
  <g transform="translate(150 380)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#83E167" stroke-width="3"/>
    <path d="M-10 0 l7 8 l15 -17" stroke="#16562D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
