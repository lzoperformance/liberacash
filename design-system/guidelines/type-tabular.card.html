<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Tabular</title><link rel="stylesheet" href="../styles.css"><style>body{background:var(--grey-0);padding:20px;font:var(--type-body)}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;min-height:78px;font:var(--type-caption);gap:1px}.sw b{font:var(--weight-semibold) 12px/1.2 var(--font-ui)}.sw span{font-family:var(--font-tabular);font-size:10px;opacity:.7}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}</style></head><body><table style="width:100%;border-collapse:collapse;font-family:var(--font-tabular)">
<thead><tr><th style="text-align:left;font:var(--weight-medium) 12px/1 var(--font-tabular);color:var(--text-subtle);padding:8px 10px;background:var(--grey-50)">Transaction Name</th><th style="text-align:left;font:var(--weight-medium) 12px/1 var(--font-tabular);color:var(--text-subtle);padding:8px 10px;background:var(--grey-50)">Account</th><th style="text-align:left;font:var(--weight-medium) 12px/1 var(--font-tabular);color:var(--text-subtle);padding:8px 10px;background:var(--grey-50)">Date & Time</th><th style="text-align:left;font:var(--weight-medium) 12px/1 var(--font-tabular);color:var(--text-subtle);padding:8px 10px;background:var(--grey-50)">Amount</th><th style="text-align:left;font:var(--weight-medium) 12px/1 var(--font-tabular);color:var(--text-subtle);padding:8px 10px;background:var(--grey-50)">Status</th></tr></thead>
