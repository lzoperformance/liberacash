<!-- @dsCard group="Colors" viewport="700x150" name="Status pairs" subtitle="Foreground on background, as used by Badge. One word per status." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css"><style>body{background:var(--grey-0);padding:20px;font:var(--type-body)}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;min-height:78px;font:var(--type-caption);gap:1px}.sw b{font:var(--weight-semibold) 12px/1.2 var(--font-ui)}.sw span{font-family:var(--font-tabular);font-size:10px;opacity:.7}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}</style></head><body><div style="display:flex;gap:12px">
<div style="flex:1;border-radius:14px;background:var(--status-success-bg);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span style="font:var(--weight-semibold) 13px/1 var(--font-ui);color:var(--status-success-fg);background:var(--grey-0);border-radius:999px;padding:6px 12px">Completed</span><code style="font:10px var(--font-tabular);color:var(--status-success-fg)">--status-success-fg<br>--status-success-bg</code></div><div style="flex:1;border-radius:14px;background:var(--status-pending-bg);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span style="font:var(--weight-semibold) 13px/1 var(--font-ui);color:var(--status-pending-fg);background:var(--grey-0);border-radius:999px;padding:6px 12px">Pending</span><code style="font:10px var(--font-tabular);color:var(--status-pending-fg)">--status-pending-fg<br>--status-pending-bg</code></div><div style="flex:1;border-radius:14px;background:var(--status-warning-bg);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span style="font:var(--weight-semibold) 13px/1 var(--font-ui);color:var(--status-warning-fg);background:var(--grey-0);border-radius:999px;padding:6px 12px">Limit near</span><code style="font:10px var(--font-tabular);color:var(--status-warning-fg)">--status-warning-fg<br>--status-warning-bg</code></div><div style="flex:1;border-radius:14px;background:var(--status-neutral-bg);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span style="font:var(--weight-semibold) 13px/1 var(--font-ui);color:var(--status-neutral-fg);background:var(--grey-0);border-radius:999px;padding:6px 12px">Draft</span><code style="font:10px var(--font-tabular);color:var(--status-neutral-fg)">--status-neutral-fg<br>--status-neutral-bg</code></div>
</div></body></html>
