<!-- @dsCard group="Colors" viewport="700x150" name="Neutral desk" subtitle="--grey-0 → --grey-900. --grey-150 is the page desk the cards float on." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Neutrals</title><link rel="stylesheet" href="../styles.css"><style>body{background:var(--grey-0);padding:20px;font:var(--type-body)}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;min-height:78px;font:var(--type-caption);gap:1px}.sw b{font:var(--weight-semibold) 12px/1.2 var(--font-ui)}.sw span{font-family:var(--font-tabular);font-size:10px;opacity:.7}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}</style></head><body><div class="row">
<div class="sw" style="background:var(--grey-0);color:var(--forest-800);box-shadow:inset 0 0 0 1px var(--grey-200)"><b>0</b><span>#FFFFFF</span></div><div class="sw" style="background:var(--grey-25);color:var(--forest-800);box-shadow:inset 0 0 0 1px var(--grey-200)"><b>25</b><span>#FCFCFC</span></div><div class="sw" style="background:var(--grey-50);color:var(--forest-800);box-shadow:inset 0 0 0 1px var(--grey-200)"><b>50</b><span>#F7F7F7</span></div><div class="sw" style="background:var(--grey-100);color:var(--forest-800);box-shadow:none"><b>100</b><span>#F1F1F1</span></div><div class="sw" style="background:var(--grey-150);color:var(--forest-800);box-shadow:none"><b>150</b><span>#E9E9E9</span></div><div class="sw" style="background:var(--grey-200);color:var(--forest-800);box-shadow:none"><b>200</b><span>#DFDFDF</span></div><div class="sw" style="background:var(--grey-300);color:var(--forest-800);box-shadow:none"><b>300</b><span>#CBCBCB</span></div><div class="sw" style="background:var(--grey-400);color:#fff;box-shadow:none"><b>400</b><span>#A8A8A8</span></div><div class="sw" style="background:var(--grey-500);color:#fff;box-shadow:none"><b>500</b><span>#828282</span></div><div class="sw" style="background:var(--grey-600);color:#fff;box-shadow:none"><b>600</b><span>#636363</span></div><div class="sw" style="background:var(--grey-700);color:#fff;box-shadow:none"><b>700</b><span>#4A4A4A</span></div><div class="sw" style="background:var(--grey-900);color:#fff;box-shadow:none"><b>900</b><span>#1B1B1B</span></div>
</div></body></html>
