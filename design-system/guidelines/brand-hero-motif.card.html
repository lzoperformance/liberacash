<!-- @dsCard group="Brand" viewport="700x220" name="Hero card motif" subtitle="--gradient-hero plus blurred white ribbons. The one decorative element in the system." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hero motif</title><link rel="stylesheet" href="../styles.css"><style>body{background:var(--grey-0);padding:20px;font:var(--type-body)}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;min-height:78px;font:var(--type-caption);gap:1px}.sw b{font:var(--weight-semibold) 12px/1.2 var(--font-ui)}.sw span{font-family:var(--font-tabular);font-size:10px;opacity:.7}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}</style></head><body><div style="display:flex;gap:16px">
<div style="flex:1;position:relative;overflow:hidden;border-radius:var(--radius-card);background:var(--gradient-hero);padding:18px;height:172px;box-shadow:var(--shadow-accent)">
<div style="position:absolute;inset:-30% -10% auto auto;width:260px;height:260px;border-radius:50%;border:26px solid rgba(255,255,255,.22);filter:blur(6px)"></div>
<div style="position:absolute;left:-60px;bottom:-90px;width:240px;height:240px;border-radius:50%;border:20px solid rgba(255,255,255,.18);filter:blur(5px)"></div>
<div style="position:relative"><div style="font:var(--weight-medium) 14px var(--font-ui);color:var(--forest-800)">Total Balance</div><div class="lc-numeric" style="font-size:38px;font-weight:700;color:var(--forest-900);margin-top:2px">$20,670 <span style="font-size:16px;font-weight:500">USD</span></div>
<div style="display:flex;gap:8px;margin-top:26px"><span style="background:var(--grey-0);border-radius:999px;padding:9px 20px;font:var(--weight-semibold) 13px var(--font-ui);color:var(--forest-800)">Deposit ↓</span><span style="background:var(--forest-800);color:var(--grey-0);border-radius:999px;padding:9px 20px;font:var(--weight-semibold) 13px var(--font-ui)">Send ↗</span></div></div>
</div>
<div style="width:172px;height:172px;border-radius:var(--radius-card);background:var(--surface-tile);border:1px solid var(--border-hairline);display:grid;place-items:center"><div style="width:96px;height:96px;border-radius:50%;background:var(--gradient-ai-orb);filter:blur(6px)"></div></div>
</div></body></html>
