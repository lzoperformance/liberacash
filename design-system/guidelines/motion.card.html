<!-- @dsCard group="Spacing" viewport="700x140" name="Motion" subtitle="140ms controls, 200ms surfaces, 320ms sheets, 700ms chart draw. One ease-out; nothing bounces." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><style>body{background:var(--grey-0);padding:20px;font:var(--type-body)}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;min-height:78px;font:var(--type-caption);gap:1px}.sw b{font:var(--weight-semibold) 12px/1.2 var(--font-ui)}.sw span{font-family:var(--font-tabular);font-size:10px;opacity:.7}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}</style></head><body><div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:12px"><code style="width:130px;font:11px var(--font-tabular);color:var(--text-accent)">--duration-fast</code><div style="width:40px;height:8px;background:var(--green-500);border-radius:999px"></div><span style="font:11px var(--font-tabular);color:var(--text-muted)">140ms</span><span style="font:var(--type-caption);color:var(--text-subtle)">controls · hover, press, focus</span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:130px;font:11px var(--font-tabular);color:var(--text-accent)">--duration-base</code><div style="width:57px;height:8px;background:var(--green-500);border-radius:999px"></div><span style="font:11px var(--font-tabular);color:var(--text-muted)">200ms</span><span style="font:var(--type-caption);color:var(--text-subtle)">surfaces · card lift, fade</span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:130px;font:11px var(--font-tabular);color:var(--text-accent)">--duration-slow</code><div style="width:92px;height:8px;background:var(--green-500);border-radius:999px"></div><span style="font:11px var(--font-tabular);color:var(--text-muted)">320ms</span><span style="font:var(--type-caption);color:var(--text-subtle)">sheets · mobile drawer, modal</span></div><div style="display:flex;align-items:center;gap:12px"><code style="width:130px;font:11px var(--font-tabular);color:var(--text-accent)">--duration-chart</code><div style="width:200px;height:8px;background:var(--green-500);border-radius:999px"></div><span style="font:11px var(--font-tabular);color:var(--text-muted)">700ms</span><span style="font:var(--type-caption);color:var(--text-subtle)">chart draw-in, once on mount</span></div>
<code style="font:11px var(--font-tabular);color:var(--text-muted);margin-top:2px">--ease-out: cubic-bezier(.22,.7,.3,1)</code>
</div></body></html>
