<!-- @dsCard group="Spacing" viewport="700x150" name="4px scale" subtitle="--space-1 … --space-32. Card interiors land on 14 / 20 / 24." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css"><style>body{background:var(--grey-0);padding:20px;font:var(--type-body)}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;min-height:78px;font:var(--type-caption);gap:1px}.sw b{font:var(--weight-semibold) 12px/1.2 var(--font-ui)}.sw span{font-family:var(--font-tabular);font-size:10px;opacity:.7}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}</style></head><body><div style="display:flex;align-items:flex-end;gap:10px">
<div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:4px;height:4px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:8px;height:8px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:12px;height:12px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:14px;height:14px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">14</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:16px;height:16px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:20px;height:20px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">20</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:24px;height:24px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">24</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:28px;height:28px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">28</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:32px;height:32px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">32</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:40px;height:40px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">40</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:48px;height:48px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">48</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:64px;height:64px;background:var(--green-500);border-radius:4px"></div><span style="font:10px var(--font-tabular);color:var(--text-subtle)">64</span></div>
</div></body></html>
