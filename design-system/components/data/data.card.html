{[['60%','Rent & Living','$2,100','var(--chart-series-1)'],['15%','Investment','$525','var(--chart-series-2)'],['12%','Education','$420','var(--chart-series-3)'],['8%','Food & Drink','$280','var(--chart-series-4)']].map(([p,n,v,c])=>

<ProgressBar value={92} label="Finance Quality" caption="Excellent · 92%"/></div></Card>
